name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    # Holds the GitHub App's client ID and key; no protection rules, so it never waits.
    environment: release
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # The App's token, not GITHUB_TOKEN: a release PR opened with GITHUB_TOKEN doesn't start CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_PLUGINS_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Reads release-please-config.json and .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Runs here, not on a release event: releases made with GITHUB_TOKEN don't start other workflows.
  publish:
    name: Publish to the Gradle Plugin Portal
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Only the attestation step uses these two: it signs with the job's OIDC token.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # plugin-publish reads the key and secret from these environment variables.
      - name: Publish
        run: ./gradlew build publishPlugins --warning-mode=fail
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      # After publishing, so only jars that reached the Plugin Portal are attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sterling-gradle-plugin/build/libs/*.jar

  # Opens a PR on the marketplace repository that pins the new tag. After `publish`, so the Sterling
  # version the skills apply resolves from the Plugin Portal before anyone installs them.
  pin-marketplace:
    name: Pin the agent plugin in the marketplace
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Holds the GitHub App's client ID and key; no protection rules, so it never waits.
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - id: sha
        name: Resolve the tag's commit
        run: echo "sha=$(git rev-parse "$TAG^{commit}")" >>"$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      # An App installed on the marketplace repository only: GITHUB_TOKEN can't write to another
      # repository, a PAT expires, and a PR opened with either wouldn't start that repository's CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_PLUGINS_APP_KEY }}
          owner: balakmran
          repositories: agent-plugins
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: balakmran/agent-plugins
          path: marketplace
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Pin the tag and open the PR
        working-directory: marketplace
        run: |
          branch="pin/sterling-$TAG"
          git switch -c "$branch"
          scripts/pin.sh sterling "$TAG" "$SHA"
          git config user.name "sterling-release[bot]"
          git config user.email "sterling-release[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: pin sterling $TAG"
          git push origin "$branch"
          gh pr create --title "feat: pin sterling $TAG" \
            --body "Pins sterling to [$TAG](https://github.com/balakmran/sterling/releases/tag/$TAG) at $SHA. Merge once CI passes, then update the plugin in each agent."
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ steps.sha.outputs.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
