# Every version Sterling uses. Exceptions: Gradle (wrapper properties), foojay (settings.gradle.kts).
#
# Rules:
# - Each table has the same two groups, in order: Consumer tools, then Sterling build.
# - Keys are sorted alphabetically within a group.
# - A version is named after its tool; every alias using it starts with that name.
# - Always use version.ref; never inline a version.
# - Check the tool's release page before changing a pin.

[versions]
# --- Consumer tools: configured by Sterling or on the consumer's buildscript classpath ---
errorprone = "2.52.0"
errorprone-gradle = "5.2.0"
google-java-format = "2.0.0"
jacoco = "0.8.16"
jspecify = "1.0.1"
nullaway = "0.14.3"
spotbugs = "4.10.5"
spotbugs-gradle = "6.5.13"
spotless = "8.11.0"

# --- Sterling build: never shipped ---
assertj = "3.27.7"
dependency-analysis = "3.20.2"
junit = "6.1.3"
ktfmt = "0.64"
plugin-publish = "2.2.1"

[libraries]
# --- Consumer tools ---
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle" }
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spotbugs = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs" }
spotbugs-gradle = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-gradle" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# --- Sterling build ---
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }

[plugins]
# --- Consumer tools ---
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# --- Sterling build ---
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
